name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  # 定时任务用 GITHUB_TOKEN 推送的提交不会触发 push 事件，
  # 所以在数据更新工作流跑完后再部署一次，保证线上数据是最新的
  workflow_run:
    workflows:
      - Update AI Coding Feed
    types:
      - completed
  # 热榜（/trending/）不入库，每次部署时现抓，定时部署让热榜按小时刷新。
  # GitHub 定时任务在这个仓库上常延迟数小时甚至跳过，要准点刷新可以让外部定时服务
  # 每小时调用一次下面的 workflow_dispatch（做法见 README“热榜聚合 · 定时更新”）。
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 对照线上上一版：标注新上榜和名次变化，失败的源沿用上一版数据；整步失败也不影响部署
      - name: Fetch trending
        continue-on-error: true
        timeout-minutes: 6
        run: >-
          python scripts/fetch_trending.py
          --out trending/data
          --previous https://mtxrym.github.io/trending/data/all.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
