name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Validate data files
        run: |
          python -c "import json; [json.load(open(p)) for p in ('blog.json', 'data/status.json', 'data/archive.json', 'manifest.webmanifest')]"

      - name: Check web scripts
        run: |
          node --check app.js
          node --check sw.js
