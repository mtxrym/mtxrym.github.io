name: Update AI Coding Feed

on:
  schedule:
    # 频率说明见 config/update_policy.yaml（tests/test_policy.py 会检查两处一致）
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      # 所有数据源都失败时脚本以非零退出（保留旧数据），GitHub 会发邮件提醒。
      # DEEPSEEK_API_KEY 未配置时自动退回关键词规则。
      - name: Generate homepage feed
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_blog_json.py

      - name: Commit feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.json data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update AI coding feed"
          # 期间如果有人推送了代码，先变基再推，避免推送被拒
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
