# 热榜数据源（/trending/ 页面与接口）
#
# 源列表和抓取逻辑移植自 NewsNow（https://github.com/ourongxing/newsnow，MIT 协议），
# 抓取器在 src/trending/ 中，按 id 一一对应；tests/test_trending.py 会检查两边一致。
#
# 字段：
#   name / title  显示名称，如“微博 · 实时热搜”
#   column        栏目：china 国内 / world 国际 / tech 科技 / finance 财经 / sports 体育
#   type          hottest 热榜（按热度排名）/ realtime 实时（按时间倒序）/ 留空为普通列表
#   interval      上游建议的刷新间隔（分钟），仅作展示参考；本站统一随 GitHub Actions 定时刷新
#   home          来源首页
#   color         卡片配色（沿用 NewsNow：red / orange / green / emerald / teal / blue / indigo / slate / gray）
#   note          备注
#
# 只发普通的公开请求：如实标明身份的 UA，不伪造 cookie / 签名 / 来源页，不处理反爬验证，
# 被拒绝就如实记为失败。NewsNow 里依赖这些手段的源（如酷安需要伪造 App 签名）没有移植。
sources:
